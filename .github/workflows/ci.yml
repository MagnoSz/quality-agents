name: framework-checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type check (desktop app, qa command, tests)
        run: npm run typecheck
      - name: Build the desktop app
        run: npm run app:build
      - name: Validate skills, workflows, links, schemas and mirrors
        run: node scripts/validate.mjs
      - name: No run artifacts in the repository
        run: node scripts/check-artifacts.mjs --all
      - name: No known secret formats in the repository
        run: node scripts/check-secrets.mjs --all
      - name: Tests
        run: node --test
